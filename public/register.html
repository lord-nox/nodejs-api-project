<!-- public/register.html -->
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
</head>
<body>
  <nav>
    <a href="index.html">Documentatie</a> |
    <a href="login.html">Login</a> |
    <a href="register.html">Register</a>
  </nav>

  <h2>Registreren</h2>
  <form id="registerForm">
    <label for="name">Naam:</label><br/>
    <input type="text" id="name" required><br/><br/>
    
    <label for="email">Email:</label><br/>
    <input type="text" id="email" required><br/><br/>
    
    <label for="password">Wachtwoord:</label><br/>
    <input type="password" id="password" required><br/><br/>
    
    <label for="age">Leeftijd:</label><br/>
    <input type="number" id="age" required><br/><br/>
    
    <label for="phone">Telefoon:</label><br/>
    <input type="text" id="phone" required><br/><br/>

    <button type="submit">Registreren</button>
  </form>

  <script>
    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const age = document.getElementById('age').value;
      const phone = document.getElementById('phone').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            password,
            age,
            phone,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          alert('Registratie geslaagd: ' + data.message);
        } else {
          alert('Registratie mislukt: ' + data.message);
        }
      } catch (error) {
        console.error(error);
      }
    });
  </script>
</body>
</html>
